services:
  db:
    image: mysql:8.4
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: palette_closet_development
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: mysql --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --execute="SELECT 1"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: mysql2://root:password@db:3306/palette_closet_development

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules

volumes:
  db_data:
  node_modules: