# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    - "coverage/**/*"

Metrics/MethodLength:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"
    - "app/models/**/*.rb"

Metrics/ClassLength:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"
    - "app/models/**/*.rb"

Metrics/AbcSize:
  Enabled: true
  Include:
    - "app/controllers/**/*.rb"
    - "app/models/**/*.rb"

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false
